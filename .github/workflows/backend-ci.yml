name: Backend CI/CD

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop, feature/deploy ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # test 프로필(H2)로 테스트
      - name: Run tests with test profile
        env:
          SPRING_PROFILES_ACTIVE: test
        run: |
          ./gradlew clean test

      # bootJar 빌드
      - name: Build bootJar
        run: ./gradlew bootJar

      # ===== Docker Hub로 이미지 push (develop 브랜치에서만) =====
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_REPOSITORY }}:latest
            ${{ secrets.DOCKERHUB_REPOSITORY }}:${{ github.sha }}

      # ===== GCP VM으로 자동 배포 (develop 브랜치에서만) =====
      - name: Deploy to GCP VM
        if: github.ref == 'refs/heads/develop'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}          # 예: 34.50.xx.xx
          username: ${{ secrets.SSH_USER }}         # 예: chj78954
          key: ${{ secrets.GCP_VM_SSH_KEY }}        # private key 전체
          port: 22
          script: |
            cd ~/12th-Integrated-Networking-BE
            git checkout feature/deploy || git checkout -b feature/deploy origin/feature/deploy
            git pull origin feature/deploy
            docker compose pull
            docker compose up -d
