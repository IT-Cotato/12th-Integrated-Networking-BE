name: Backend CI/CD

on:
  push:
    branches: [ feature/deploy ]   # feature/deploy 브랜치에 push 될 때
  pull_request:
    branches: [ develop ]          # develop 으로 PR 보낼 때 (테스트만)

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1) 테스트는 test 프로필(H2)로 실행
      - name: Run tests with test profile
        env:
          SPRING_PROFILES_ACTIVE: test
        run: |
          ./gradlew clean test

      # 2) bootJar 빌드
      - name: Build bootJar
        run: |
          ./gradlew bootJar

      # 3) Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4) Docker 이미지 빌드 + latest / sha 태그로 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_REPOSITORY }}:latest
            ${{ secrets.DOCKERHUB_REPOSITORY }}:${{ github.sha }}

      # 5) GCP VM에 SSH로 접속해서 git pull + docker compose pull/up 실행
      #    → PR 에서는 배포하지 않도록 push + feature/deploy 조건을 명시
      - name: Deploy to GCP VM
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/deploy'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd ~/12th-Integrated-Networking-BE
            git fetch origin
            git checkout feature/deploy || git checkout -b feature/deploy origin/feature/deploy
            git pull origin feature/deploy
            docker compose pull
            docker compose up -d
