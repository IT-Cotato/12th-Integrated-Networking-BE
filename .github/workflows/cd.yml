name: CD

#해당 브랜치에 push(merge) 했을 때
on:
  push:
    branches:
      - develop

#테스트 결과 작성을 위해 쓰기권한 추가
permissions: write-all
#jdk 세팅
#gradle 캐싱
#test를 제외한 프로젝트 빌드
#도커 빌드 & 이미지 push
#docker-compose 파일을 ec2 서버에 배포
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
        
      - name: Grant Execute Permission For Gradlew
        run: chmod +x gradlew

      - name: Build With Gradle
        run: ./gradlew build -x test

      - name: Docker build & Push
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker buildx build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/networking2 --push .
          docker buildx build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/nginx --push ./nginx

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/compose/"
          overwrite: true

      - name: Deploy Images with Docker compose
        uses: appleboy/ssh-action@master
        env:
          APP: "networking2"
          COMPOSE: "/home/compose/docker-compose.yml"
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          REDIRECT_URI: ${{ secrets.REDIRECT_URI }}
        with:
          username: ubuntu
          host: ${{ secrets.EC2_HOST }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          envs: APP, COMPOSE, JWT_SECRET_KEY, CLIENT_ID, REDIRECT_URI
          script: |
            sudo docker-compose -f $COMPOSE down
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/networking2
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/nginx
            sudo -E docker-compose -f $COMPOSE up -d
