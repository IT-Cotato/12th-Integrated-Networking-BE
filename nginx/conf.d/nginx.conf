# HTTP - redirect to HTTPS
server {
    listen 80;
    server_name integrated-team6.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name integrated-team6.duckdns.org;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/integrated-team6.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/integrated-team6.duckdns.org/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://networking2:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
