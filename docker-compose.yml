services:
  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    env_file:
      - ./env/db.env
    networks:
      - cotato-net

  backend:
    image: neibler/cotato-backend:0.1.0
    container_name: cotato-backend
    restart: always
    env_file:
      - ./env/backend.env
    depends_on:
      - db
    ports:
      - "8080:8080"
    networks:
      - cotato-net

networks:
  cotato-net:
    driver: bridge
